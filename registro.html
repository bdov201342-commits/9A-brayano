<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Atlético Nacional</title>
  <style>
    * {
      margin: 0;añade 
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #001a0d 0%, #003f2d 50%, #002815 100%);
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(0, 212, 98, 0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(255, 215, 0, 0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .estrella {
      position: fixed;
      color: rgba(255, 215, 0, 0.05);
      font-size: 20px;
      pointer-events: none;
      z-index: 0;
      animation: brillar 4s ease-in-out infinite alternate;
    }
    .estrella:nth-child(1)  { top: 8%;  left: 10%; animation-delay: 0s; }
    .estrella:nth-child(2)  { top: 20%; left: 80%; animation-delay: 0.7s; font-size: 30px; }
    .estrella:nth-child(3)  { top: 50%; left: 5%; animation-delay: 1.4s; font-size: 16px; }
    .estrella:nth-child(4)  { top: 70%; left: 85%; animation-delay: 0.4s; }
    .estrella:nth-child(5)  { top: 85%; left: 30%; animation-delay: 2s; font-size: 25px; }
    .estrella:nth-child(6)  { top: 40%; left: 70%; animation-delay: 1s; font-size: 14px; }

    @keyframes brillar {
      0%   { opacity: 0.15; transform: scale(1) rotate(0deg); }
      100% { opacity: 0.6;  transform: scale(1.3) rotate(180deg); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 410px;
      margin: 20px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 24px;
      padding: 45px 36px 36px;
      border: 1px solid rgba(0, 212, 98, 0.08);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      opacity: 0;
      animation: subir 0.8s ease-out 0.2s forwards;
    }

    @keyframes subir {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 25%;
      right: 25%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0, 212, 98, 0.3), transparent);
      border-radius: 50%;
    }

    .volver {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255, 255, 255, 0.3);
      text-decoration: none;
      font-size: 0.8rem;
      margin-bottom: 28px;
      transition: all 0.3s ease;
      letter-spacing: 1px;
    }
    .volver:hover {
      color: rgba(0, 212, 98, 0.6);
    }

    .escudo {
      display: block;
      font-size: 2.2rem;
      margin-bottom: 4px;
    }

    .titulo {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .titulo span {
      color: #00d462;
    }

    .subtitulo {
      color: rgba(255, 255, 255, 0.25);
      font-size: 0.8rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    .grupo {
      margin-bottom: 20px;
      opacity: 0;
      animation: subir 0.5s ease-out forwards;
    }
    .grupo:nth-of-type(1) { animation-delay: 0.4s; }
    .grupo:nth-of-type(2) { animation-delay: 0.55s; }

    label {
      display: block;
      color: rgba(255, 255, 255, 0.35);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(0, 212, 98, 0.03);
      border: 1px solid rgba(0, 212, 98, 0.08);
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.3s ease;
    }
    input::placeholder {
      color: rgba(255, 255, 255, 0.1);
    }
    input:hover {
      border-color: rgba(0, 212, 98, 0.15);
    }
    input:focus {
      border-color: rgba(0, 212, 98, 0.25);
      background: rgba(0, 212, 98, 0.05);
      box-shadow: 0 0 0 4px rgba(0, 212, 98, 0.04);
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      background: linear-gradient(135deg, rgba(0, 212, 98, 0.12), rgba(0, 212, 98, 0.04));
      border: 1px solid rgba(0, 212, 98, 0.12);
      border-radius: 12px;
      color: #00d462;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 3px;
      cursor: pointer;
      transition: all 0.4s ease;
      opacity: 0;
      animation: subir 0.5s ease-out 0.7s forwards;
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 212, 98, 0.06), transparent);
      transition: left 0.6s ease;
    }
    .btn:hover::before {
      left: 100%;
    }
    .btn:hover {
      background: linear-gradient(135deg, rgba(0, 212, 98, 0.2), rgba(0, 212, 98, 0.08));
      border-color: rgba(0, 212, 98, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 212, 98, 0.08);
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: rgba(255, 255, 255, 0.12);
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0;
      animation: subir 0.5s ease-out 0.9s forwards;
    }
    .footer strong {
      color: rgba(0, 212, 98, 0.3);
    }
  </style>
</head>
<body>
  <div class="estrella">&#9733;</div>
  <div class="estrella">&#9733;</div>
  <div class="estrella">&#9733;</div>
  <div class="estrella">&#9733;</div>
  <div class="estrella">&#9733;</div>
  <div class="estrella">&#9733;</div>

  <div class="card">
    <a href="index.html" class="volver">&larr; Volver al inicio</a>
    <span class="escudo">&#9881;</span>
    <h1 class="titulo">ATLÉTICO <span>NACIONAL</span></h1>
    <p class="subtitulo">Registro de hincha</p>

    <form id="form-registro">
      <div class="grupo">
        <label for="nombre">Nombre de usuario</label>
        <input type="text" id="nombre" name="nombre" value="brayan" placeholder="Tu usuario verdolaga" required>
      </div>

      <div class="grupo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" value="2012" placeholder="Tu contraseña" required>
      </div>

      <button type="submit" class="btn">&#9829; Iniciar sesión</button>
    </form>

    <p class="footer">Usuario: <strong>brayan</strong> &middot; Contraseña: <strong>2012</strong></p>

    <p class="footer"><strong>#VamosVerde</strong> &middot; Orgullo verdolaga</p>
  </div>

  <script>
    document.getElementById('form-registro').addEventListener('submit', function (e) {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value.trim();
      const password = document.getElementById('password').value.trim();

      if (nombre.toLowerCase() === 'brayan' && password === '2012') {
        localStorage.setItem('usuario', 'brayan');
        localStorage.setItem('password', '2012');
        window.location.href = 'menu.html';
      } else {
        alert('Usuario o contraseña incorrectos. Usa brayan / 2012.');
      }
    });

    if (localStorage.getItem('usuario') === 'brayan') {
      window.location.href = 'menu.html';
    }
  </script>
</body>
</html>
