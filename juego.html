<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Mundo del Fútbol | Torneo de Penales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      background: #0F172A;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 15% 10%, rgba(34, 197, 94, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 85%, rgba(34, 197, 94, 0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .pelota-flotante {
      position: fixed;
      font-size: 26px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.06;
      animation: rodar 12s ease-in-out infinite;
    }
    .pelota-flotante:nth-child(1)  { top: 12%;  left: 6%;  animation-delay: 0s; }
    .pelota-flotante:nth-child(2)  { top: 28%;  left: 92%; animation-delay: 1.5s; font-size: 34px; }
    .pelota-flotante:nth-child(3)  { top: 60%;  left: 4%;  animation-delay: 3s; font-size: 20px; }
    .pelota-flotante:nth-child(4)  { top: 75%;  left: 95%; animation-delay: 4.5s; }
    .pelota-flotante:nth-child(5)  { top: 88%;  left: 12%; animation-delay: 2s; font-size: 30px; }

    @keyframes rodar {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-20px) rotate(40deg); }
    }

    /* ============ HEADER ============ */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(34, 197, 94, 0.12);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-icono {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #22C55E, #15803D);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.35);
      animation: pulso-logo 3s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulso-logo {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }

    .logo-nombre {
      font-size: 1.15rem;
      font-weight: 800;
      color: #F8FAFC;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }
    .logo-nombre span {
      color: #22C55E;
    }
    .logo-sub {
      font-size: 0.62rem;
      color: rgba(248, 250, 252, 0.4);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-link {
      padding: 8px 16px;
      border-radius: 50px;
      color: rgba(248, 250, 252, 0.6);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      border: 1px solid transparent;
    }
    .nav-link:hover {
      color: #22C55E;
      background: rgba(34, 197, 94, 0.08);
    }
    .nav-link.activo {
      color: #22C55E;
      background: rgba(34, 197, 94, 0.1);
      border-color: rgba(34, 197, 94, 0.2);
    }

    /* ============ MAIN ============ */
    .main {
      position: relative;
      z-index: 1;
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 22px 50px;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(34, 197, 94, 0.12);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      opacity: 0;
      animation: subir 0.8s ease-out forwards;
    }

    @keyframes subir {
      0%   { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .card-titulo {
      font-size: clamp(1.4rem, 3.5vw, 1.8rem);
      font-weight: 700;
      color: #F8FAFC;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .card-titulo .emoji {
      color: #22C55E;
    }
    .card-sub {
      color: rgba(248, 250, 252, 0.45);
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.5px;
      margin-bottom: 22px;
    }

    .botones {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 26px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 28px;
      border: 1px solid rgba(34, 197, 94, 0.25);
      border-radius: 50px;
      background: linear-gradient(135deg, #22C55E, #15803D);
      color: #F8FAFC;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.35s ease;
      box-shadow: 0 8px 25px rgba(34, 197, 94, 0.2);
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      transition: left 0.5s ease;
    }
    .btn:hover::before {
      left: 100%;
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 35px rgba(34, 197, 94, 0.35);
      filter: brightness(1.1);
    }
    .btn:active {
      transform: translateY(-1px);
    }

    .btn-borde {
      background: transparent;
      color: #22C55E;
      box-shadow: none;
    }
    .btn-borde:hover {
      background: rgba(34, 197, 94, 0.1);
      filter: none;
    }

    /* ============ PANTALLAS ============ */
    .pantalla {
      display: none;
    }
    .pantalla.activo {
      display: block;
    }

    /* ============ INICIO ============ */
    .inicio-contenido {
      text-align: center;
    }

    .trofeo-icono {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      font-size: 2.4rem;
      background: linear-gradient(135deg, #22C55E, #15803D);
      box-shadow: 0 0 40px rgba(34, 197, 94, 0.4);
      margin-bottom: 18px;
      animation: pulso-logo 3s ease-in-out infinite;
    }

    .inicio-titulo {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 900;
      letter-spacing: 0.5px;
    }
    .inicio-titulo span {
      background: linear-gradient(90deg, #22C55E, #4ADE80);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .inicio-sub {
      color: rgba(248, 250, 252, 0.55);
      font-weight: 300;
      margin-top: 10px;
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .selector-titulo {
      margin-top: 30px;
      margin-bottom: 16px;
      color: rgba(248, 250, 252, 0.6);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 600;
    }

    .selector-equipos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      text-align: left;
    }

    .equipo-card {
      position: relative;
      background: rgba(34, 197, 94, 0.04);
      border: 2px solid rgba(34, 197, 94, 0.15);
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      font-family: inherit;
      color: #F8FAFC;
      text-align: center;
      transition: all 0.3s ease;
      overflow: hidden;
    }
    .equipo-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: var(--color, #22C55E);
    }
    .equipo-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(34, 197, 94, 0.15);
    }
    .equipo-card.seleccionado {
      border-color: #22C55E;
      background: rgba(34, 197, 94, 0.12);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.12);
    }
    .equipo-escudo {
      display: block;
      font-size: 1.6rem;
      margin-bottom: 6px;
    }
    .equipo-nombre {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .controles-info {
      margin-top: 22px;
      padding: 14px 18px
